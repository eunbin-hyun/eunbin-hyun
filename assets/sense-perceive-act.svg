<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Sense, perceive, act</title>
  <desc id="desc">A clean hand-drawn camera, edge AI chip, and robot respond in sequence.</desc>

  <defs>
    <style>
      .ink { fill:none; stroke:#303640; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
      .detail { fill:none; stroke:#67717e; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; }
      .hand { font-family:"Segoe Print","Comic Sans MS",cursive; font-weight:700; fill:#303640; }
      .caption { font-family:"Segoe UI",Arial,sans-serif; font-weight:600; fill:#7a838d; letter-spacing:1.2px; }
      .stage { transform-box:fill-box; transform-origin:center; }
      .stage-sense { animation:senseStep 6s cubic-bezier(.2,0,0,1) infinite; }
      .stage-think { animation:thinkStep 6s cubic-bezier(.2,0,0,1) infinite; }
      .stage-act { animation:actStep 6s cubic-bezier(.2,0,0,1) infinite; }
      .robot-ink { fill:none; stroke:#75569d; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
      .robot-detail { fill:none; stroke:#9678b7; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; }
      @keyframes senseStep { 0%,24%,100%{transform:translateY(0)} 7%,15%{transform:translateY(-4px)} }
      @keyframes thinkStep { 0%,30%,58%,100%{transform:translateY(0)} 39%,49%{transform:translateY(-4px)} }
      @keyframes actStep { 0%,64%,92%,100%{transform:translate(0,0)} 73%{transform:translate(4px,-3px)} 82%{transform:translate(8px,0)} }
      @media (prefers-reduced-motion:reduce) {
        .stage { animation:none; }
      }
    </style>
  </defs>

  <!-- quiet connector lines -->
  <path d="M246 114 C282 106 316 106 352 114" fill="none" stroke="#d5d9df" stroke-width="4" stroke-linecap="round"/>
  <path d="M548 114 C584 106 618 106 654 114" fill="none" stroke="#d5d9df" stroke-width="4" stroke-linecap="round"/>
  <path d="M341 106 l13 8 -13 9" class="detail"/>
  <path d="M643 106 l13 8 -13 9" class="detail"/>

  <!-- stage 1: sense -->
  <g class="stage stage-sense">
    <path d="M91 96 Q91 86 101 86 L124 86 132 76 Q136 71 142 72 L168 73 Q175 73 178 79 L183 86 201 87 Q210 87 210 97 L208 143 Q208 152 198 152 L102 151 Q92 151 92 142 Z" fill="#ffffff" stroke="#303640" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="119" r="26" fill="#e8f0fe" stroke="#303640" stroke-width="3.5"/>
    <circle cx="150" cy="119" r="14" fill="none" stroke="#4285f4" stroke-width="3.5"/>
    <circle cx="150" cy="119" r="5" fill="#4285f4">
      <animate attributeName="r" values="5;5;8;5;5" keyTimes="0;.07;.12;.18;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M109 82 q7-11 15-2" class="detail"/>
    <path d="M109 163 q41 7 83-1" fill="none" stroke="#4285f4" stroke-width="2" stroke-linecap="round" stroke-opacity=".28"/>
    <path d="M82 69 l-8-7 M88 61 l-2-10 M215 67 l8-8" class="detail" opacity=".38">
      <animate attributeName="opacity" values=".15;.65;.15;.15" keyTimes="0;.1;.22;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="150" y="30" text-anchor="middle" class="hand" font-size="19">sense</text>
  <text x="150" y="211" text-anchor="middle" class="caption" font-size="11">CAMERA · SENSOR</text>

  <!-- stage 2: perceive -->
  <g class="stage stage-think">
    <path d="M404 82 Q404 75 412 75 L489 76 Q497 76 497 84 L496 146 Q496 153 488 153 L412 152 Q404 152 405 145 Z" fill="#ffffff" stroke="#303640" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M393 91h12 M393 109h12 M393 128h12 M393 145h12 M496 91h12 M496 109h12 M496 128h12 M496 145h12 M417 64v12 M438 64v12 M460 64v12 M482 65v11 M417 153v12 M438 153v12 M460 153v12 M482 153v12" class="detail"/>
    <path d="M423 120 C431 94 444 139 451 111 S475 96 487 120" fill="none" stroke="#34a853" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 150;0 150;150 0;150 0" keyTimes="0;.34;.52;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="423" cy="120" r="4" fill="#34a853">
      <animate attributeName="opacity" values=".25;.25;1;.25;.25" keyTimes="0;.35;.39;.53;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="451" cy="111" r="4" fill="#34a853">
      <animate attributeName="opacity" values=".25;.25;1;.25;.25" keyTimes="0;.39;.43;.53;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="487" cy="120" r="4" fill="#34a853">
      <animate attributeName="opacity" values=".25;.25;1;.25;.25" keyTimes="0;.43;.47;.53;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M407 169 q43 6 88-1" fill="none" stroke="#34a853" stroke-width="2" stroke-linecap="round" stroke-opacity=".28"/>
    <path d="M381 66 l-8-8 M388 59 l-2-10 M518 66 l8-8" class="detail" opacity=".28">
      <animate attributeName="opacity" values=".15;.15;.65;.15;.15" keyTimes="0;.33;.43;.56;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="450" y="30" text-anchor="middle" class="hand" font-size="19">perceive</text>
  <text x="450" y="211" text-anchor="middle" class="caption" font-size="11">EDGE AI · ROS 2</text>

  <!-- stage 3: act -->
  <g class="stage stage-act">
    <path d="M703 139 Q706 112 720 100 Q744 89 777 97 Q793 106 799 139 Z" fill="#ffffff" stroke="#75569d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M725 99 V88 Q725 81 733 80 L770 81 Q778 81 779 89 V99" class="robot-ink"/>
    <path d="M735 80 Q751 74 770 81" class="robot-detail" opacity=".7"/>
    <circle cx="723" cy="147" r="15" fill="#ddd0ec" stroke="#75569d" stroke-width="3.5"/>
    <circle cx="779" cy="147" r="15" fill="#ddd0ec" stroke="#75569d" stroke-width="3.5"/>
    <circle cx="723" cy="147" r="5" fill="#a142f4"/>
    <circle cx="779" cy="147" r="5" fill="#a142f4"/>
    <circle cx="735" cy="116" r="4" fill="#a142f4"/>
    <circle cx="770" cy="116" r="4" fill="#a142f4"/>
    <path d="M740 128 q12 7 24 0" class="robot-detail"/>
    <path d="M808 119 q14-6 23 1 M809 131 q16-3 25 4" class="robot-detail">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.7;.78;.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M707 169 q42 6 87-1" fill="none" stroke="#a142f4" stroke-width="2" stroke-linecap="round" stroke-opacity=".28"/>
    <path d="M682 69 l-8-7 M688 61 l-2-10 M816 67 l8-8" class="detail" opacity=".28">
      <animate attributeName="opacity" values=".15;.15;.65;.15;.15" keyTimes="0;.67;.77;.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="750" y="30" text-anchor="middle" class="hand" font-size="19" style="fill:#75569d">act!</text>
  <text x="750" y="211" text-anchor="middle" class="caption" font-size="11">ROBOT MOTION</text>
</svg>
