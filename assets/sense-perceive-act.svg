<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Sense, perceive, act</title>
  <desc id="desc">Sensor data travels through edge AI inference and becomes robot motion.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <style>
      .flow { animation: flow 1.1s linear infinite; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .wheel { animation: wheel .9s linear infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.82); } 50% { opacity:1; transform:scale(1.05); } }
      @keyframes wheel { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .wheel { animation: none; }
      }
    </style>
  </defs>

  <rect x="8" y="8" width="884" height="204" rx="24" fill="url(#panel)" stroke="#d6dde8" stroke-width="2"/>

  <path d="M244 110H344" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path class="flow" d="M244 110H344" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12"/>
  <path d="M556 110H656" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path class="flow" d="M556 110H656" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12"/>

  <circle r="5" cy="110" fill="#0284c7">
    <animate attributeName="cx" values="248;340;248" keyTimes="0;.86;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" cy="110" fill="#16a34a">
    <animate attributeName="cx" values="560;652;560" keyTimes="0;.86;1" dur="1.8s" begin=".45s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="1.8s" begin=".45s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="58" y="43" width="186" height="134" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="151" y="69" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#475569">SENSE</text>
    <rect x="105" y="86" width="92" height="58" rx="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <circle cx="151" cy="115" r="18" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <circle cx="151" cy="115" r="7" fill="#0ea5e9"/>
    <circle class="pulse" cx="151" cy="115" r="25" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M120 153h62" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="344" y="32" width="212" height="156" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="450" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#475569">PERCEIVE</text>
    <rect x="395" y="78" width="110" height="68" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
    <path d="M413 78V68M438 78V68M463 78V68M488 78V68M413 156v-10M438 156v-10M463 156v-10M488 156v-10M395 94h-10M395 112h-10M395 130h-10M515 94h-10M515 112h-10M515 130h-10" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
    <circle class="pulse" cx="425" cy="112" r="7" fill="#22c55e"/>
    <circle class="pulse" cx="450" cy="96" r="7" fill="#16a34a" style="animation-delay:.3s"/>
    <circle class="pulse" cx="475" cy="112" r="7" fill="#22c55e" style="animation-delay:.6s"/>
    <path d="M425 112L450 96l25 16-25 18z" fill="none" stroke="#166534" stroke-width="2" stroke-linejoin="round"/>
    <text x="450" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b">EDGE AI · ROS 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="656" y="43" width="186" height="134" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="749" y="69" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#475569">ACT</text>
    <path d="M702 133h92l-9-40h-74z" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M732 93V80h34v13M749 80V69" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="749" cy="67" r="5" fill="#8b5cf6">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.25s" repeatCount="indefinite"/>
    </circle>
    <circle class="wheel" cx="723" cy="142" r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="4" stroke-dasharray="5 3"/>
    <circle class="wheel" cx="775" cy="142" r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="4" stroke-dasharray="5 3"/>
    <path d="M714 162h70" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="294" y="97" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">DATA</text>
  <text x="606" y="97" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">COMMAND</text>
</svg>
