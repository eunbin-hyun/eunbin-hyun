<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">From sensing to motion</title>
  <desc id="desc">Camera sensing flows through edge AI inference and ROS 2 into a moving robot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#19324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6b82"/>
    </marker>
  </defs>
  <rect x="6" y="6" width="888" height="258" rx="30" fill="url(#bg)" stroke="#c9dbe5" stroke-width="2"/>
  <path d="M235 132 C275 103 306 103 342 132" fill="none" stroke="#4a6b82" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M558 132 C599 103 630 103 666 132" fill="none" stroke="#4a6b82" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="62" y="62" width="174" height="138" rx="24" fill="#fff" stroke="#5d86a1" stroke-width="3"/>
    <rect x="102" y="91" width="96" height="67" rx="14" fill="#eaf4fb" stroke="#244c67" stroke-width="4"/>
    <circle cx="150" cy="124" r="22" fill="#fff" stroke="#244c67" stroke-width="5"/>
    <circle cx="150" cy="124" r="9" fill="#52a7d8"/>
    <path d="M118 177h64" stroke="#244c67" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="342" y="43" width="216" height="176" rx="26" fill="#fff" stroke="#4f8f70" stroke-width="3"/>
    <rect x="380" y="76" width="140" height="84" rx="16" fill="#e9f7ef" stroke="#2b6848" stroke-width="4"/>
    <path d="M399 76V62M426 76V62M454 76V62M481 76V62M508 76V62M399 174v-14M426 174v-14M454 174v-14M481 174v-14M508 174v-14" stroke="#2b6848" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 96h-14M380 122h-14M380 148h-14M534 96h-14M534 122h-14M534 148h-14" stroke="#2b6848" stroke-width="4" stroke-linecap="round"/>
    <path d="M412 132l25-25 18 18 29-31" fill="none" stroke="#39a86b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#28563f">EDGE AI · ROS 2</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="666" y="62" width="174" height="138" rx="24" fill="#fff" stroke="#866aa6" stroke-width="3"/>
    <path d="M710 158h88l-8-52h-72z" fill="#f2ecf8" stroke="#563f74" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="730" cy="172" r="13" fill="#fff" stroke="#563f74" stroke-width="5"/>
    <circle cx="778" cy="172" r="13" fill="#fff" stroke="#563f74" stroke-width="5"/>
    <path d="M754 106V82M738 82h32M754 82l25-18" fill="none" stroke="#563f74" stroke-width="5" stroke-linecap="round"/>
    <circle cx="781" cy="62" r="8" fill="#9c6fd0"/>
  </g>
  <text x="149" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#244c67">SENSE</text>
  <text x="450" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a6b82">perception → inference → control</text>
  <text x="753" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#563f74">MOVE</text>
</svg>
